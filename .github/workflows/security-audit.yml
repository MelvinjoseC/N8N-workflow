name: Security & Static Code Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run Bandit AST Security Scan
      run: |
        bandit -r scripts/ -ll -x tests/

    - name: Run Workflow Secret & Security Linter
      run: |
        python scripts/lint_workflows.py workflows/ --fail-on-warnings
