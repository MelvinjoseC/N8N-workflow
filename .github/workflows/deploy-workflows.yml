name: Deploy Workflows to n8n

on:
  push:
    branches: [ main, master ]
    paths:
      - 'workflows/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Sync Workflows to n8n
      env:
        N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        N8N_API_URL: ${{ secrets.N8N_API_URL }}
      run: |
        python scripts/deploy_workflows.py workflows/
