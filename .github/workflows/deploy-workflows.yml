name: Deploy Workflows to n8n

on:
  push:
    branches: [ main, master ]
    paths:
      - 'workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Sync Workflows to n8n
      env:
        N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        N8N_API_URL: ${{ secrets.N8N_API_URL }} # e.g. https://n8n.mycompany.com/api/v1
      run: |
        python -c "
        import os
        import sys
        import glob
        import json
        import urllib.request
        import urllib.error

        api_key = os.environ.get('N8N_API_KEY')
        api_url = os.environ.get('N8N_API_URL')

        if not api_key or not api_url:
            print('Error: N8N_API_KEY or N8N_API_URL environment variable is missing.')
            sys.exit(1)

        headers = {
            'X-N8N-API-KEY': api_key,
            'Content-Type': 'application/json'
        }

        # Remove trailing slash from URL
        api_url = api_url.rstrip('/')

        workflow_files = glob.glob('workflows/*.json')
        print(f'Found {len(workflow_files)} workflows to deploy.')

        for file in workflow_files:
            print(f'\nDeploying {file}...')
            with open(file, 'r') as f:
                workflow_data = json.load(f)

            # Map fields for API
            payload = {
                'name': workflow_data.get('name'),
                'nodes': workflow_data.get('nodes'),
                'connections': workflow_data.get('connections'),
                'settings': workflow_data.get('settings'),
                'active': workflow_data.get('active', False)
            }

            workflow_id = workflow_data.get('id')
            url = f'{api_url}/workflows'
            method = 'POST'

            if workflow_id:
                # Check if workflow exists on target instance
                check_url = f'{api_url}/workflows/{workflow_id}'
                req = urllib.request.Request(check_url, headers=headers, method='GET')
                try:
                    with urllib.request.urlopen(req) as resp:
                        if resp.status == 200:
                            print(f'Workflow ID {workflow_id} exists. Performing UPDATE.')
                            url = f'{api_url}/workflows/{workflow_id}'
                            method = 'PUT'
                except urllib.error.HTTPError as e:
                    if e.code == 404:
                        print(f'Workflow ID {workflow_id} not found. Creating new workflow.')
                    else:
                        print(f'HTTP Error checking workflow: {e.code} - {e.reason}')
                        continue
                except Exception as e:
                    print(f'Error checking workflow: {str(e)}')
                    continue

            req = urllib.request.Request(
                url, 
                data=json.dumps(payload).encode('utf-8'), 
                headers=headers, 
                method=method
            )

            try:
                with urllib.request.urlopen(req) as resp:
                    result = json.loads(resp.read().decode('utf-8'))
                    print(f'Successfully deployed workflow: {result.get(\"name\")} (ID: {result.get(\"id\")})')
            except urllib.error.HTTPError as e:
                print(f'Failed to deploy workflow: {e.code} - {e.reason}')
                print(e.read().decode('utf-8'))
            except Exception as e:
                print(f'Unexpected error deploying workflow: {str(e)}')
        "
