name: Lint n8n Workflows

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Run Workflow Linter
      run: |
        python scripts/lint_workflows.py workflows/ --fail-on-warnings --format junit --output n8n-lint-report.xml

    - name: Upload Lint Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: n8n-lint-junit-report
        path: n8n-lint-report.xml
