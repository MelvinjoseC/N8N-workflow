repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: lint-workflows
        name: Lint n8n Workflows
        entry: python scripts/lint_workflows.py
        language: system
        files: ^workflows/.*\.json$
        pass_filenames: true

      - id: validate-env-template
        name: Validate .env.example Schema
        entry: python scripts/validate_env.py --env-file .env.example --example-file .env.example --allow-placeholders
        language: system
        files: ^\.env\.example$
        pass_filenames: false

      - id: run-tests
        name: Run Unit Tests
        entry: pytest -q
        language: system
        files: ^(scripts|tests)/.*\.py$
        pass_filenames: false
